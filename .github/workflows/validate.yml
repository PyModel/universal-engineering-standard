name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate skill format (official skills-ref, pinned commit)
        # The validator requires the directory name to equal the skill name; the
        # checkout directory is the repository name.
        run: pipx run --spec 'git+https://github.com/agentskills/agentskills@f130f348f502d9804278a617f86929846896d2e9#subdirectory=skills-ref' skills-ref validate "$GITHUB_WORKSPACE"
      - name: Check links and eval corpus structure
        run: python3 scripts/check.py
